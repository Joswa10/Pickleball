<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pickle Jam">
  <title>Pickle Jam</title>
  <link rel="stylesheet" href="styles.css?v=13">
  <script>
    // Real mobile browsers (esp. iOS Safari) lie about 100vh because the
    // address bar shows/hides. This keeps the app frame sized to what's
    // actually visible, with 100dvh in the CSS as the modern first choice.
    function setViewportHeightVar() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setViewportHeightVar();
    window.addEventListener('resize', setViewportHeightVar);
    window.addEventListener('orientationchange', setViewportHeightVar);
  </script>
</head>
<body>
  <div class="app-frame">
   <header>
      <h1>Pickle Jam</h1>
      <p>Queue</p>

      <!-- MULTIPLAYER: mini QR toggle (Host only) — opens the spectator
           QR code in a modal. Hidden by default; script.js reveals it
           once a room exists. -->
      <button type="button" id="qrToggleBtn" class="qr-toggle-btn" hidden aria-label="Show spectator QR code">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <line x1="14" y1="14" x2="14" y2="21"></line>
          <line x1="21" y1="14" x2="21" y2="21"></line>
          <line x1="17.5" y1="14" x2="17.5" y2="17.5"></line>
          <line x1="14" y1="17.5" x2="21" y2="17.5"></line>
        </svg>
      </button>
    </header>

    <main class="container">

      <!-- MULTIPLAYER: Viewer badge (Viewer mode only) -->
      <div id="viewerBadge" class="viewer-badge" hidden>
        🔴 Live View — Room <span id="viewerRoomCode"></span>
      </div>

      <!-- Waiting Queue -->
      <section class="card">
        <div class="card-header">
          <h2>Waiting Queue</h2>
          <span id="queueCount">0 players</span>
        </div>
        <div class="input-row">
          <label class="photo-picker" id="photoPickerLabel" for="photoInput">
            <img id="photoPreview" class="photo-preview" alt="">
            <span id="photoPickerIcon" class="photo-picker-icon">📷</span>
            <input type="file" id="photoInput" accept="image/*" hidden>
          </label>
          <input type="text" id="nameInput" placeholder="Enter player name" maxlength="24">
          <button id="addBtn" class="btn-primary">+ Add</button>
        </div>
        <ul id="queueList" class="scroll-list"></ul>
        <div class="action-row">
          <button id="removeBtn" class="btn-danger-light">Remove Last</button>
          <button id="clearQueueBtn" class="btn-danger">Clear Queue</button>
        </div>
      </section>

      <!-- Court Section -->
      <section class="card court-card">
        <h2>Court</h2>
        <div class="team-label" id="team1Label">Team 1</div>

        <div class="court-visual">
          <div class="kitchen-zone"></div>
          <div class="court-net"></div>

          <div class="slot" id="slot0">
            <div class="player-info">
              <div class="player-photo-wrap"></div>
              <span class="player-name">— —</span>
            </div>
            <div class="score-control">
              <button class="score-btn score-minus" onclick="adjustScore(0, -1)">-</button>
              <span class="score-val" id="score0">0</span>
              <button class="score-btn score-plus" onclick="adjustScore(0, 1)">+</button>
            </div>
          </div>

          <div class="slot" id="slot1">
            <div class="player-info">
              <div class="player-photo-wrap"></div>
              <span class="player-name">— —</span>
            </div>
            <div class="score-control">
              <button class="score-btn score-minus" onclick="adjustScore(1, -1)">-</button>
              <span class="score-val" id="score1">0</span>
              <button class="score-btn score-plus" onclick="adjustScore(1, 1)">+</button>
            </div>
          </div>

          <div class="slot" id="slot2">
            <div class="player-info">
              <div class="player-photo-wrap"></div>
              <span class="player-name">— —</span>
            </div>
            <div class="score-control">
              <button class="score-btn score-minus" onclick="adjustScore(2, -1)">-</button>
              <span class="score-val" id="score2">0</span>
              <button class="score-btn score-plus" onclick="adjustScore(2, 1)">+</button>
            </div>
          </div>

          <div class="slot" id="slot3">
            <div class="player-info">
              <div class="player-photo-wrap"></div>
              <span class="player-name">— —</span>
            </div>
            <div class="score-control">
              <button class="score-btn score-minus" onclick="adjustScore(3, -1)">-</button>
              <span class="score-val" id="score3">0</span>
              <button class="score-btn score-plus" onclick="adjustScore(3, 1)">+</button>
            </div>
          </div>
        </div>

        <div class="team-label" id="team2Label">Team 2</div>
        <button id="saveBtn" class="btn-primary full-width-btn" disabled>S A V E</button>
      </section>

      <!-- Action Buttons -->
      <section class="court-actions-bar">
        <button id="shuffleBtn" class="btn-secondary">Shuffle</button>
        <button id="fillCourtBtn" class="btn-primary">Fill Court</button>
        <button id="resetCourtBtn" class="btn-warning" disabled>Reset Court</button>
      </section>

      <!-- Recently Finished Players -->
      <section class="card">
        <h2>Recently Finished</h2>
        <div id="finishedContainer" class="scroll-list"></div>
      </section>

      <!-- Match History -->
      <section class="card">
        <div class="card-header">
          <h2>Match History</h2>
          <button id="clearHistoryBtn" class="btn-danger-light small-btn">Clear</button>
        </div>
        <div id="historyList" class="scroll-list"></div>
      </section>
    </main>

    <!-- ============================================================
         MULTIPLAYER: QR modal (Host only) — hidden until qrToggleBtn
         in the header is tapped. Same QR/room-code/copy-link content
         as before, just presented as a popup instead of always-on.
    ============================================================= -->
    <div class="qr-modal-overlay" id="qrModalOverlay" hidden>
      <div class="qr-modal">
        <button type="button" id="qrModalCloseBtn" class="qr-modal-close" aria-label="Close">&times;</button>
        <h2>Spectator Link</h2>
        <div id="qrcodeContainer" class="qrcode-container"></div>
        <p class="room-code-text">Room Code: <strong id="roomCodeText"></strong></p>
        <button type="button" id="copyLinkBtn" class="btn-secondary small-btn copy-link-btn">Copy Viewer Link</button>
      </div>
    </div>
  </div>

  <!-- ==============================================================
       MULTIPLAYER: External libraries — load BEFORE script.js.

       1) Firebase compat SDKs (App + Realtime Database). The "compat"
          build is used so no bundler/ES-modules setup is needed on
          GitHub Pages — everything hangs off the global `firebase`
          object, same as the old <script>-tag Firebase examples.
       2) QRCode.js (davidshimjs) — renders the spectator QR code
          into #qrcodeContainer via `new QRCode(el, { text, ... })`.
  =============================================================== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script src="script.js?v=14"></script>
</body>
</html>
